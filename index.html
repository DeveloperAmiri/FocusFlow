<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusFlow 🍅 — Pomodoro Timer & Task Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     FocusFlow — warm handmade wellness theme
     Sand #EDE6D9 · Bone #F7F3EA · Charcoal #3A3630
     Terracotta #C1613A · Olive #7C7C4A · borders 1.5px #D8CFBC, 20px
     ============================================================ */
  :root {
    --sand: #EDE6D9;          /* page background */
    --bone: #F7F3EA;          /* card surface */
    --bone-2: #FDFBF6;        /* raised surface (inputs, tasks) */
    --ink: #3A3630;           /* charcoal text */
    --muted: #8A8172;         /* warm gray */
    --terra: #C1613A;         /* Terracotta — focus accent */
    --terra-deep: #A34E2D;
    --olive: #7C7C4A;         /* Olive — second accent */
    --olive-deep: #63633A;
    --clay: #8C5A3C;          /* long-break clay */
    --border: #D8CFBC;
    --radius: 20px;
    --bw: 1.5px;              /* border width */

    --font-body: "Inter", "Samim", "Sahel", "Segoe UI", system-ui, Tahoma, sans-serif;
    --font-display: "Fraunces", "Kalameh", Georgia, serif;

    /* per-mode accents (set on <body data-mode>) */
    --mode-color: var(--terra);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    color: var(--ink);
    min-height: 100vh;
    background:
      radial-gradient(640px 400px at 8% -4%, rgba(193, 97, 58, 0.07), transparent 60%),
      radial-gradient(640px 400px at 96% 104%, rgba(124, 124, 74, 0.08), transparent 60%),
      var(--sand);
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-font-smoothing: antialiased;
  }

  body[data-mode="focus"] { --mode-color: var(--terra); }
  body[data-mode="short"] { --mode-color: var(--olive); }
  body[data-mode="long"]  { --mode-color: var(--clay); }

  /* ---------- header ---------- */
  header {
    width: min(1060px, 94vw);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 6px 18px;
  }
  .logo {
    font-family: var(--font-display);
    font-size: 27px;
    font-weight: 600;
    letter-spacing: .2px;
    color: var(--ink);
  }
  .logo span { color: var(--terra); }
  .header-actions { display: flex; gap: 8px; }

  /* ---------- buttons: flat, border-driven, no shadows ---------- */
  .ghost-btn {
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 500;
    background: transparent;
    border: var(--bw) solid var(--border);
    color: var(--ink);
    border-radius: 14px;
    padding: 9px 15px;
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .ghost-btn:hover { border-color: var(--ink); }

  /* ---------- layout ---------- */
  .layout {
    width: min(1060px, 94vw);
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 22px;
    padding-bottom: 40px;
    align-items: start;
  }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .card {
    background: var(--bone);
    border: var(--bw) solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
  }

  /* ---------- mode tabs ---------- */
  .modes { display: flex; gap: 6px; justify-content: center; margin-bottom: 28px; flex-wrap: wrap; }
  .modes button {
    font-family: var(--font-body);
    font-size: 13.5px;
    font-weight: 500;
    color: var(--muted);
    background: transparent;
    border: var(--bw) solid transparent;
    padding: 8px 17px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .18s;
  }
  .modes button:hover { color: var(--ink); border-color: var(--border); }
  .modes button.active {
    color: var(--bone);
    background: var(--mode-color);
    border-color: var(--mode-color);
    font-weight: 600;
  }

  /* ---------- ring ---------- */
  .ring-wrap { display: flex; justify-content: center; margin: 8px 0 28px; }
  .ring-box { position: relative; width: 272px; height: 272px; }
  .ring-box svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--border); stroke-width: 12; }
  .ring-progress {
    fill: none;
    stroke: var(--mode-color);
    stroke-width: 12;
    stroke-linecap: round;
    transition: stroke-dashoffset .35s linear, stroke .3s;
  }
  .ring-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  .time {
    font-family: var(--font-display);
    font-size: 62px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: .5px;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }
  .mode-label {
    color: var(--muted);
    letter-spacing: 3px;
    font-size: 11.5px;
    text-transform: uppercase;
    margin-top: 10px;
  }
  .session-dots { margin-top: 12px; display: flex; gap: 7px; }
  .session-dots i {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--border);
    transition: background .2s;
  }
  .session-dots i.on { background: var(--terra); }

  /* ---------- controls ---------- */
  .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .primary-btn {
    font-family: var(--font-body);
    font-size: 15.5px;
    font-weight: 600;
    color: var(--mode-color);
    background: transparent;
    border: var(--bw) solid var(--mode-color);
    border-radius: 14px;
    padding: 13px 44px;
    cursor: pointer;
    min-width: 156px;
    transition: background .15s, color .15s, transform .12s;
  }
  .primary-btn:hover { background: var(--mode-color); color: var(--bone); }
  .primary-btn:active { transform: translateY(1px); }

  /* ---------- stats ---------- */
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
  .stat {
    background: rgba(237, 230, 217, 0.6);
    border-radius: 14px;
    padding: 13px 8px;
    text-align: center;
  }
  .stat b {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    display: block;
    font-variant-numeric: tabular-nums;
  }
  .stat small { color: var(--muted); font-size: 10.5px; letter-spacing: .9px; text-transform: uppercase; }

  /* ---------- tasks ---------- */
  .task-form { display: flex; gap: 8px; margin-bottom: 16px; }
  .task-form input[type="text"] {
    flex: 1; font-family: var(--font-body); font-size: 14px;
    background: var(--bone-2); border: var(--bw) solid var(--border); border-radius: 14px;
    color: var(--ink); padding: 11px 14px; outline: none; min-width: 0;
    transition: border-color .15s;
  }
  .task-form input[type="text"]:focus { border-color: var(--terra); }
  .task-form input[type="text"]::placeholder { color: var(--muted); }
  .task-form input[type="number"] {
    width: 68px; font-family: var(--font-body);
    background: var(--bone-2); border: var(--bw) solid var(--border); border-radius: 14px;
    color: var(--ink); padding: 11px 8px; outline: none; text-align: center;
  }
  .task-form input[type="number"]:focus { border-color: var(--terra); }
  .task-form .ghost-btn { font-weight: 600; }
  .task-form .ghost-btn:hover { border-color: var(--terra); color: var(--terra); }

  .task-list { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
  .task {
    display: flex; align-items: center; gap: 10px;
    background: var(--bone-2);
    border: var(--bw) solid var(--border);
    border-radius: 14px;
    padding: 11px 13px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .task:hover { border-color: #BFB49B; }
  .task.current { border-color: var(--terra); }
  .task input[type="checkbox"] { accent-color: var(--terra); width: 16px; height: 16px; cursor: pointer; }
  .task .t-text { flex: 1; font-size: 14.5px; }
  .task.done .t-text { text-decoration: line-through; color: var(--muted); }
  .task .t-est {
    font-size: 12.5px; font-weight: 600; color: var(--olive); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .task .t-est.full { color: var(--terra); }
  .task .t-del {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    font-size: 15px; padding: 2px 7px; border-radius: 8px;
    transition: color .15s, background .15s;
  }
  .task .t-del:hover { color: var(--terra); background: rgba(193, 97, 58, 0.10); }
  .empty-note { color: var(--muted); font-size: 13.5px; text-align: center; padding: 22px 0; }

  /* ---------- settings modal ---------- */
  .modal-bg {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(58, 54, 48, 0.42);
    z-index: 20;
  }
  .modal-bg.show { display: flex; }
  .modal {
    width: min(420px, 92vw);
    background: var(--bone);
    border: var(--bw) solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
  }
  .modal h3 { margin-bottom: 16px; font-size: 19px; font-family: var(--font-display); font-weight: 600; }
  .setting-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 11px 0; border-bottom: 1px solid var(--border);
  }
  .setting-row:last-of-type { border-bottom: 0; }
  .setting-row label { font-size: 14.5px; }
  .setting-row input[type="number"] {
    width: 76px; font-family: var(--font-body);
    background: var(--bone-2); border: var(--bw) solid var(--border); border-radius: 10px;
    color: var(--ink); padding: 8px; text-align: center; outline: none;
  }
  .setting-row input[type="number"]:focus { border-color: var(--terra); }
  .switch { position: relative; width: 44px; height: 24px; display: inline-block; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0; border-radius: 999px;
    background: var(--border); cursor: pointer; transition: .2s;
  }
  .switch .track::after {
    content: ""; position: absolute; width: 18px; height: 18px; border-radius: 50%;
    background: var(--bone-2); top: 3px; left: 3px; transition: .2s;
  }
  .switch input:checked + .track { background: var(--terra); }
  .switch input:checked + .track::after { transform: translateX(20px); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .danger-btn { color: var(--terra) !important; }
  .danger-btn:hover { border-color: var(--terra) !important; }
  .solid-btn {
    font-family: var(--font-body);
    font-size: 14px; font-weight: 600;
    background: var(--ink); color: var(--bone);
    border: var(--bw) solid var(--ink);
    border-radius: 14px; padding: 9px 18px; cursor: pointer;
    transition: background .15s;
  }
  .solid-btn:hover { background: #4A443B; }

  footer { padding: 18px; color: var(--muted); font-size: 12px; }

  /* gentle breathing pulse while running */
  @keyframes pulse { 50% { opacity: .6; } }
  body.running .time { animation: pulse 2.4s ease-in-out infinite; }

  @media (max-width: 520px) {
    .card { padding: 24px 18px; }
    .time { font-size: 52px; }
    .ring-box { width: 232px; height: 232px; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body data-mode="focus">

<header>
  <div class="logo">🍅 Focus<span>Flow</span></div>
  <div class="header-actions">
    <button class="ghost-btn" id="notify-btn" title="enable notifications">🔔</button>
    <button class="ghost-btn" id="settings-btn" title="settings">⚙️</button>
  </div>
</header>

<div class="layout">
  <!-- ===================== timer card ===================== -->
  <section class="card">
    <div class="modes">
      <button data-mode="focus" class="active">🎯 Focus</button>
      <button data-mode="short">☕ Short break</button>
      <button data-mode="long">🌴 Long break</button>
    </div>

    <div class="ring-wrap">
      <div class="ring-box">
        <svg width="272" height="272" viewBox="0 0 272 272">
          <circle class="ring-bg" cx="136" cy="136" r="118"/>
          <circle class="ring-progress" id="ring" cx="136" cy="136" r="118"/>
        </svg>
        <div class="ring-center">
          <div class="time" id="time">25:00</div>
          <div class="mode-label" id="mode-label">focus session</div>
          <div class="session-dots" id="dots"></div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="ghost-btn" id="reset-btn" title="reset (R)">↺ reset</button>
      <button class="primary-btn" id="start-btn">▶ start</button>
      <button class="ghost-btn" id="skip-btn" title="skip (S)">⏭ skip</button>
    </div>
  </section>

  <!-- ===================== tasks + stats card ===================== -->
  <section class="card">
    <div class="stats-row">
      <div class="stat"><b id="s-today">0</b><small>🍅 today</small></div>
      <div class="stat"><b id="s-minutes">0</b><small>min focus</small></div>
      <div class="stat"><b id="s-streak">0</b><small>day streak</small></div>
      <div class="stat"><b id="s-total">0</b><small>total 🍅</small></div>
    </div>

    <form class="task-form" id="task-form">
      <input type="text" id="task-input" placeholder="What are you working on?" autocomplete="off" maxlength="90">
      <input type="number" id="task-est" min="1" max="12" value="1" title="estimated pomodoros">
      <button class="ghost-btn" type="submit">＋ add</button>
    </form>

    <ul class="task-list" id="task-list"></ul>
    <div class="empty-note" id="empty-note">no tasks yet — add one above 🌱</div>
  </section>
</div>

<!-- ===================== settings modal ===================== -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3>⚙️ Settings</h3>
    <div class="setting-row">
      <label>Focus length (min)</label>
      <input type="number" id="set-focus" min="1" max="90">
    </div>
    <div class="setting-row">
      <label>Short break (min)</label>
      <input type="number" id="set-short" min="1" max="30">
    </div>
    <div class="setting-row">
      <label>Long break (min)</label>
      <input type="number" id="set-long" min="1" max="45">
    </div>
    <div class="setting-row">
      <label>Auto-start next session</label>
      <label class="switch"><input type="checkbox" id="set-auto"><span class="track"></span></label>
    </div>
    <div class="setting-row">
      <label>Sound</label>
      <label class="switch"><input type="checkbox" id="set-sound"><span class="track"></span></label>
    </div>
    <div class="modal-actions">
      <button class="ghost-btn danger-btn" id="reset-stats-btn">reset stats</button>
      <button class="solid-btn" id="close-settings-btn">done</button>
    </div>
  </div>
</div>

<footer>vanilla HTML · CSS · JS — your data stays in your browser (localStorage) · Fraunces &amp; Inter · MIT</footer>

<script>
/* ============================================================
   FocusFlow — pomodoro engine + task tracker
   ============================================================ */
(function () {
  'use strict';

  // ---------- persistence -------------------------------------------------
  var LS_SETTINGS = 'focusflow:settings';
  var LS_TASKS = 'focusflow:tasks';
  var LS_STATS = 'focusflow:stats';

  function load(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; }
    catch (e) { return fallback; }
  }
  function save(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

  var settings = Object.assign(
    { focus: 25, short: 5, long: 15, autoStart: true, sound: true },
    load(LS_SETTINGS, {})
  );
  var tasks = load(LS_TASKS, []);
  var stats = load(LS_STATS, { date: today(), sessions: 0, minutes: 0, streak: 0, totalSessions: 0 });
  var currentTaskId = null;

  // ---------- state --------------------------------------------------------
  var mode = 'focus';            // focus | short | long
  var running = false;
  var remaining = settings.focus * 60;
  var total = settings.focus * 60;
  var endAt = null;
  var tickId = null;
  var completedFocus = 0;        // completed focus sessions in the current cycle

  var MODE_LABELS = { focus: 'focus session', short: 'short break', long: 'long break' };

  // ---------- dom ------------------------------------------------------------
  var $ = function (id) { return document.getElementById(id); };
  var timeEl = $('time'), ringEl = $('ring'), startBtn = $('start-btn');
  var RING_C = 2 * Math.PI * 118;
  ringEl.style.strokeDasharray = RING_C;

  // ---------- utilities -------------------------------------------------------
  function today(offsetDays) {
    var d = new Date();
    if (offsetDays) d.setDate(d.getDate() + offsetDays);
    return d.toISOString().slice(0, 10);
  }

  function fmt(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
  }

  function chime() {
    if (!settings.sound) return;
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      [880, 660, 990].forEach(function (freq, i) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        var t = ctx.currentTime + i * 0.18;
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.35, t + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.6);
      });
    } catch (e) { /* audio unavailable — no big deal */ }
  }

  function notify(title, body) {
    if ('Notification' in window && Notification.permission === 'granted') {
      try { new Notification(title, { body: body }); } catch (e) {}
    }
  }

  // ---------- stats ---------------------------------------------------------
  function rollStats(focusMinutes) {
    var t = today();
    if (stats.date !== t) {
      stats.streak = (stats.date === today(-1)) ? (stats.streak || 0) + 1 : 1;
      stats.date = t;
      stats.sessions = 0;
      stats.minutes = 0;
    }
    stats.sessions = (stats.sessions || 0) + 1;
    stats.minutes = (stats.minutes || 0) + focusMinutes;
    stats.totalSessions = (stats.totalSessions || 0) + 1;
    save(LS_STATS, stats);
    renderStats();
  }

  function renderStats() {
    var t = today();
    var showToday = stats.date === t;
    $('s-today').textContent = showToday ? stats.sessions : 0;
    $('s-minutes').textContent = showToday ? stats.minutes : 0;
    $('s-total').textContent = stats.totalSessions || 0;
    var active = (stats.date === t || stats.date === today(-1)) ? (stats.streak || 0) : 0;
    $('s-streak').textContent = active;
  }

  // ---------- tasks -----------------------------------------------------------
  function renderTasks() {
    var list = $('task-list');
    list.innerHTML = '';
    $('empty-note').style.display = tasks.length ? 'none' : 'block';

    tasks.forEach(function (task) {
      var li = document.createElement('li');
      li.className = 'task' + (task.done ? ' done' : '') + (task.id === currentTaskId ? ' current' : '');

      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = task.done;
      cb.addEventListener('click', function (e) { e.stopPropagation(); });
      cb.addEventListener('change', function () {
        task.done = cb.checked;
        if (task.done && task.id === currentTaskId) currentTaskId = null;
        save(LS_TASKS, tasks);
        renderTasks();
      });

      var text = document.createElement('div');
      text.className = 't-text';
      text.textContent = task.text;

      var est = document.createElement('div');
      est.className = 't-est' + (task.spent >= task.est ? ' full' : '');
      est.textContent = '🍅 ' + task.spent + '/' + task.est;

      var del = document.createElement('button');
      del.className = 't-del';
      del.textContent = '✕';
      del.title = 'delete';
      del.addEventListener('click', function (e) {
        e.stopPropagation();
        tasks = tasks.filter(function (t) { return t.id !== task.id; });
        if (currentTaskId === task.id) currentTaskId = null;
        save(LS_TASKS, tasks);
        renderTasks();
      });

      li.append(cb, text, est, del);
      li.addEventListener('click', function () {
        if (task.done) return;
        currentTaskId = (currentTaskId === task.id) ? null : task.id;
        renderTasks();
      });
      list.appendChild(li);
    });
  }

  $('task-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = $('task-input');
    var text = input.value.trim();
    if (!text) return;
    var est = Math.max(1, Math.min(12, parseInt($('task-est').value, 10) || 1));
    tasks.push({ id: Date.now(), text: text, est: est, spent: 0, done: false });
    input.value = '';
    save(LS_TASKS, tasks);
    renderTasks();
  });

  // ---------- timer ------------------------------------------------------------
  function renderTime() {
    timeEl.textContent = fmt(remaining);
    var progress = total > 0 ? 1 - remaining / total : 0;
    ringEl.style.strokeDashoffset = RING_C * (1 - progress);
    document.title = (running ? '' : '⏸ ') + fmt(remaining) + ' · ' + MODE_LABELS[mode] + ' — FocusFlow 🍅';
  }

  function renderMode() {
    document.body.dataset.mode = mode;
    document.querySelectorAll('.modes button').forEach(function (b) {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    $('mode-label').textContent = MODE_LABELS[mode];
    renderDots();
  }

  function renderDots() {
    var dots = $('dots');
    dots.innerHTML = '';
    for (var i = 0; i < 4; i++) {
      var dot = document.createElement('i');
      if (i < (completedFocus % 4 === 0 && completedFocus > 0 ? 4 : completedFocus % 4)) dot.className = 'on';
      dots.appendChild(dot);
    }
  }

  function tick() {
    remaining = Math.max(0, (endAt - Date.now()) / 1000);
    renderTime();
    if (remaining <= 0) complete(true);
  }

  function start() {
    if (running) return;
    if (remaining <= 0) remaining = settings[mode] * 60;
    running = true;
    endAt = Date.now() + remaining * 1000;
    tickId = setInterval(tick, 250);
    startBtn.textContent = '⏸ pause';
    document.body.classList.add('running');
    renderTime();
  }

  function pause() {
    if (!running) return;
    running = false;
    clearInterval(tickId);
    startBtn.textContent = '▶ resume';
    document.body.classList.remove('running');
    renderTime();
  }

  function resetTimer() {
    pause();
    remaining = total = settings[mode] * 60;
    renderTime();
  }

  function setMode(next, autoStart) {
    pause();
    mode = next;
    remaining = total = settings[mode] * 60;
    renderMode();
    renderTime();
    if (autoStart && settings.autoStart) start();
  }

  function complete(countIt) {
    pause();
    chime();

    if (countIt && mode === 'focus') {
      completedFocus++;
      rollStats(settings.focus);
      var task = tasks.find(function (t) { return t.id === currentTaskId && !t.done; });
      if (task) {
        task.spent++;
        save(LS_TASKS, tasks);
        renderTasks();
      }
      notify('🍅 Focus session complete!', 'Time for a ' + (completedFocus % 4 === 0 ? 'long' : 'short') + ' break.');
      setMode(completedFocus % 4 === 0 ? 'long' : 'short', true);
    } else if (countIt) {
      notify('☕ Break over', 'Back to focus — you got this.');
      setMode('focus', true);
    } else {
      // skipped: move on without credit (long break only if this would complete a cycle)
      setMode(mode === 'focus' ? (completedFocus % 4 === 3 ? 'long' : 'short') : 'focus', false);
    }
  }

  // ---------- controls -----------------------------------------------------------
  startBtn.addEventListener('click', function () { running ? pause() : start(); });
  $('reset-btn').addEventListener('click', resetTimer);
  $('skip-btn').addEventListener('click', function () { complete(false); });

  document.querySelectorAll('.modes button').forEach(function (btn) {
    btn.addEventListener('click', function () { setMode(btn.dataset.mode, false); });
  });

  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (e.code === 'Space') { e.preventDefault(); running ? pause() : start(); }
    else if (e.key === 'r' || e.key === 'R') resetTimer();
    else if (e.key === 's' || e.key === 'S') complete(false);
  });

  // ---------- notifications ---------------------------------------------------
  $('notify-btn').addEventListener('click', function () {
    if (!('Notification' in window)) { alert('Notifications are not supported in this browser.'); return; }
    Notification.requestPermission().then(function (p) {
      $('notify-btn').textContent = p === 'granted' ? '🔔' : '🔕';
      if (p === 'granted') notify('🍅 FocusFlow', 'Notifications enabled — happy focusing!');
    });
  });
  if ('Notification' in window) {
    $('notify-btn').textContent = Notification.permission === 'granted' ? '🔔' : '🔕';
  }

  // ---------- settings modal ----------------------------------------------------
  function openSettings() {
    $('set-focus').value = settings.focus;
    $('set-short').value = settings.short;
    $('set-long').value = settings.long;
    $('set-auto').checked = settings.autoStart;
    $('set-sound').checked = settings.sound;
    $('modal-bg').classList.add('show');
  }
  $('settings-btn').addEventListener('click', openSettings);
  $('close-settings-btn').addEventListener('click', function () {
    settings.focus = clampMin($('set-focus').value, 25);
    settings.short = clampMin($('set-short').value, 5);
    settings.long = clampMin($('set-long').value, 15);
    settings.autoStart = $('set-auto').checked;
    settings.sound = $('set-sound').checked;
    save(LS_SETTINGS, settings);
    $('modal-bg').classList.remove('show');
    if (!running) resetTimer(); // apply new duration to the current mode
  });
  $('modal-bg').addEventListener('click', function (e) {
    if (e.target === this) $('close-settings-btn').click();
  });
  $('reset-stats-btn').addEventListener('click', function () {
    if (confirm('Reset all stats (today, streak, total)?')) {
      stats = { date: today(), sessions: 0, minutes: 0, streak: 0, totalSessions: 0 };
      save(LS_STATS, stats);
      completedFocus = 0;
      renderStats();
      renderDots();
    }
  });

  function clampMin(value, fallback) {
    var n = parseInt(value, 10);
    if (isNaN(n) || n < 1) n = fallback;
    return Math.min(90, n);
  }

  // ---------- boot ------------------------------------------------------------
  renderStats();
  renderTasks();
  renderMode();
  resetTimer();
})();
</script>
</body>
</html>
